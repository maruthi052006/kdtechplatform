{% extends 'base.html' %}
{% block title %}404 Not Found | KDTechX{% endblock %}

{% block content %}
<div class="kd-auth-wrapper kd-bg-grid">
  <div class="kd-glow-radial"></div>
  <div class="kd-auth-card text-center">
    <div class="kd-empty-icon mx-auto text-warning mb-3">
      <i class="bi bi-compass"></i>
    </div>
    <div class="display-4 fw-bold text-muted mb-2">404</div>
    <h2 class="kd-auth-title">Page Not Found</h2>
    <p class="kd-auth-subtitle mb-4">The URL or resource you requested does not exist or has been relocated.</p>
    <div class="d-flex justify-content-center gap-2">
      <a href="javascript:history.back()" class="kd-btn kd-btn-secondary">Go Back</a>
      <a href="/" class="kd-btn kd-btn-primary">Return Home</a>
    </div>
  </div>
</div>
{% endblock %}
