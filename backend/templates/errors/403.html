{% extends 'base.html' %}
{% block title %}403 Forbidden | KDTechX{% endblock %}

{% block content %}
<div class="kd-auth-wrapper kd-bg-grid">
  <div class="kd-glow-radial"></div>
  <div class="kd-auth-card text-center">
    <div class="kd-empty-icon mx-auto text-danger mb-3">
      <i class="bi bi-shield-x"></i>
    </div>
    <h2 class="kd-auth-title">Access Denied</h2>
    <p class="kd-auth-subtitle mb-4">You do not have the required permissions to view this resource.</p>
    <div class="d-flex justify-content-center gap-2">
      <a href="javascript:history.back()" class="kd-btn kd-btn-secondary">Go Back</a>
      <a href="/" class="kd-btn kd-btn-primary">Return Home</a>
    </div>
  </div>
</div>
{% endblock %}
